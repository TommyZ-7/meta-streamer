# static-only traffic page; container runs as nginx user (uid 101), listens 8080.
# All writable paths live under /tmp (mounted tmpfs, rootfs is read-only).
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 64;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        root /usr/share/nginx/html;

        # generated page + json
        location = / { try_files /index.html =404; }
        location = /traffic.json { add_header Cache-Control "public, max-age=60"; }

        # nothing else exists
        location / { return 404; }
    }
}
