services:
  mediamtx:
    # Pinned release (multi-arch incl. ARM64 for Oracle A1). Bump deliberately.
    image: ${MTX_IMAGE:-bluenviron/mediamtx:1.21.0}
    container_name: meta-streamer
    restart: unless-stopped
    # 1 OCPU VM: cap runaway RSS/CPU so one bad stream can't starve the host.
    mem_limit: 1g
    cpus: "1.0"
    # :554 allows Topaz-compatible URLs without port
    # (rtspt://live.meta-note-ex.com/live/{key}).
    # Host 8554 -> container 554 is an alias for clients that require explicit port.
    ports:
      - "1935:1935" # RTMP ingest
      - "554:554" # RTSP (standard, Topaz-compatible)
      - "8554:554" # RTSP (alias, explicit-port fallback)
      - "8000:8000/udp" # RTP
      - "8001:8001/udp" # RTCP
    cap_add:
      - NET_BIND_SERVICE # allow :554 bind as non-root
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    command: ["/mediamtx.yml"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  # Bitrate watchdog: live/* の合計ingress(映像+音声)が上限を超過し続けたらkick
  watchdog:
    image: python:3.12-slim
    container_name: meta-watchdog
    restart: unless-stopped
    # Least privilege: stdlib-only poller, needs net + /tmp heartbeat only.
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 128m
    cpus: "0.25"
    depends_on:
      - mediamtx
    environment:
      - MTX_API_BASE=http://mediamtx:9997
      - MAX_TOTAL_KBPS=${MAX_TOTAL_KBPS:-2500}
      - POLL_INTERVAL=${POLL_INTERVAL:-5}
      - VIOLATION_LIMIT=${VIOLATION_LIMIT:-3}
      - PATH_PREFIX=live/
    volumes:
      - ./scripts/bitrate-watchdog.py:/watchdog.py:ro
    command: ["python3", "-u", "/watchdog.py"]
    healthcheck:
      test: ["CMD-SHELL", "python3 /watchdog.py --check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  # Public traffic page: static files generated by cron (scripts/traffic.py)
  # into ./public, served read-only. Host totals only, no per-stream data.
  traffic:
    image: nginx:alpine
    container_name: meta-traffic
    restart: unless-stopped
    # Non-root nginx on 8080 (mapped to host 80). Static files only.
    user: "101:101"
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 64m
    cpus: "0.25"
    ports:
      - "80:8080" # public traffic page
    volumes:
      - ./traffic/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./public:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/traffic.json || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 360s # first cron render lands within ~5 min of provision
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
